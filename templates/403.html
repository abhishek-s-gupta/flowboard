{% extends 'base.html' %}

{% block title %}403 Forbidden — Flowboard{% endblock %}

{% block content %}
<div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px;">
  <div class="empty-state" style="max-width: 440px; background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px 32px;">
    <svg class="empty-state-icon" style="color: var(--danger);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
    <div class="empty-state-title" style="font-size: 18px;">Access Restricted (403)</div>
    <div class="empty-state-desc">You do not have permission to view or modify this project board. Only invited members have access.</div>
    <a href="{% url 'projects:project_list' %}" class="btn btn-primary" id="btnBackToProjects403" style="margin-top: 10px;">
      Return to All Projects
    </a>
  </div>
</div>
{% endblock %}
